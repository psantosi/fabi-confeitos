<div class="container py-5">
    <h1 class="title-imperial">Alguns dos nossos trabalhos...</h1>

    <div class="container gap-4 my-4">
        <div class="row">
            @for (image of galleryImage; track image.id) {
                <div
                    class="card col-sm-3 col-6 mb-4"
                    data-bs-toggle="modal"
                    data-bs-target="#galleryModal"
                    (click)="openImage(image)"
                >
                    <div class="card-body">
                        <img [src]="image.src" [alt]="image.title" class="card-img-top">
                    </div>
                </div>
            }
        </div>
    </div>
</div>


<div class="modal fade" id="galleryModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-body">
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        <img [src]="imageSelected.src" class="img-fluid rounded mx-auto d-block">
      </div>
  </div>
</div>
