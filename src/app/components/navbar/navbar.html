<header>
    <div class="bg-banner pt-4 pb-2">
        <a [class.active]="isRouteActive('/home')" routerLink="/home">
            <img src="logo.jpg" class="mx-auto d-block rounded-circle shadow-sm" alt="Logo">
        </a>
    </div>

    <nav class="navbar navbar-expand-md" data-bs-theme="dark">
        <div class="container-fluid text-center">
            <h3 class="current-page">{{ getTitle() }}</h3>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" (click)="isCollapsed = true">
                <i class="bi bi-menu-button-wide"></i>
            </button>
            
            <div class="collapse navbar-collapse d-md-flex flex-md-column" id="navbarNav" [class.show]="isCollapsed" (click)="isCollapsed = !isCollapsed">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link px-4" [class.active]="isRouteActive('/home')" routerLink="/home">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-4" [class.active]="isRouteActive('/entreprise')" routerLink="/entreprise">Empresa</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-4" [class.active]="isRouteActive('/products')" routerLink="/products/cake">Produtos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-4" [class.active]="isRouteActive('/gallery')" routerLink="/gallery">Galeria</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-4" [class.active]="isRouteActive('/order')" routerLink="/order">Pedido</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
